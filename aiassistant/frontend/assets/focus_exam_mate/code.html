<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exam Mate - Focus</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../app-shell.css"></head>
<body class="min-h-screen bg-slate-50 pb-24">
<header class="sticky top-0 z-10 flex items-center justify-between bg-[#0D0C22] px-5 py-4 text-white"><button onclick="navigate('dashboard')" class="font-bold">Exam Mate</button><nav class="hidden gap-5 text-sm md:flex"><button onclick="navigate('planner')">Planner</button><button onclick="navigate('flashcards')">Cards</button><button onclick="navigate('quiz')">Quiz</button></nav><button onclick="navigate('profile')" class="text-sm font-bold text-emerald-300">Profile</button></header>
<main class="mx-auto max-w-2xl px-5 py-10"><p class="text-xs font-bold uppercase tracking-widest text-emerald-700">Focus mode</p><h1 class="mt-2 text-3xl font-black">One focused session</h1><p class="mt-2 text-slate-500">Choose a realistic block, remove distractions, and finish what you started.</p>
<section class="mt-8 rounded-3xl bg-[#0D0C22] p-8 text-center text-white shadow-xl"><div id="timer" class="text-7xl font-black tracking-tight">25:00</div><p id="status" class="mt-3 text-slate-400">Ready when you are.</p><div class="mt-7 flex justify-center gap-3"><button id="start" class="rounded-xl bg-emerald-600 px-6 py-3 font-bold">Start</button><button id="reset" class="rounded-xl bg-white/10 px-6 py-3 font-bold">Reset</button></div></section>
<section class="mt-6 rounded-2xl bg-white p-5 shadow-sm"><div class="mb-4"><h2 class="font-bold">Session settings</h2><p class="mt-1 text-sm text-slate-500">Your completed sessions are saved to your private history.</p></div><div class="grid gap-3 sm:grid-cols-2"><label class="text-sm font-bold">Work minutes<input id="minutes" type="number" min="1" max="120" value="25" class="mt-2 w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Subject<input id="subject" maxlength="80" placeholder="Optional" class="mt-2 w-full rounded-xl border p-3"></label></div><p id="history" class="mt-5 text-sm text-slate-500">Loading completed sessions...</p></section></main>
<nav class="fixed bottom-0 flex w-full justify-around border-t bg-white px-3 py-3 text-xs font-bold"><button onclick="navigate('dashboard')">Home</button><button class="text-emerald-700" onclick="navigate('focus')">Focus</button><button onclick="navigate('planner')">Planner</button><button onclick="navigate('profile')">Profile</button></nav>
<script src="../api-utils.js"></script><script>
if (!localStorage.getItem('em_token')) navigate('login');
let seconds = 25 * 60, timerId = null, running = false;
const timer = document.getElementById('timer'), status = document.getElementById('status'), minutes = document.getElementById('minutes');
function draw() { timer.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0'); }
function reset() { clearInterval(timerId); running = false; seconds = Math.max(1, Math.min(120, Number(minutes.value) || 25)) * 60; document.getElementById('start').textContent = 'Start'; status.textContent = 'Ready when you are.'; draw(); }
async function complete() { const response = await apiFetch(API + '/focus-sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({work_minutes:Math.round(seconds / 60) || Number(minutes.value), subject:document.getElementById('subject').value.trim()})}); const data = response ? await response.json().catch(() => ({})) : {}; status.textContent = response && response.ok ? 'Session saved. Nice work.' : (data.message || data.error || 'Session finished, but could not be saved.'); loadHistory(); }
document.getElementById('start').onclick = () => { if (running) return; running = true; document.getElementById('start').textContent = 'In progress'; status.textContent = 'Stay with it.'; timerId = setInterval(() => { seconds -= 1; draw(); if (seconds <= 0) { clearInterval(timerId); running = false; document.getElementById('start').textContent = 'Start'; complete(); } }, 1000); };
document.getElementById('reset').onclick = reset; minutes.onchange = reset;
async function loadHistory() { const response = await apiFetch(API + '/focus-sessions'); const data = response ? await response.json().catch(() => ({})) : {}; if (!response || !response.ok) { history.textContent = data.message || data.error || 'Focus history is unavailable. Apply the reviewed migration, then reload.'; return; } const sessions = data.sessions || []; history.textContent = sessions.length ? sessions.length + ' completed session' + (sessions.length === 1 ? '' : 's') + ' saved.' : 'No completed sessions yet.'; }
reset(); loadHistory();
</script></body></html>
