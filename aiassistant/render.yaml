services:
  - type: web
    name: exam-mate-backend
    # Switch to Docker runtime for maximum reliability with monorepo paths
    runtime: docker
    # Specify the local context and the path to the Dockerfile
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard
      - key: GROQ_API_KEY
        sync: false # Set this in Render Dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SUPABASE_URL
        sync: false # Set your Supabase URL here
      - key: SUPABASE_KEY
        sync: false # Set your Supabase service-role key here (server-side only)
      - key: SUPABASE_STORAGE_BUCKET
        value: exam-documents
      - key: DOCUMENT_CHUNKS_TABLE
        value: document_chunks
      - key: CORS_ORIGINS
        sync: false # Set to the deployed Vercel origin, e.g. https://exam-mate.vercel.app
      - key: ENVIRONMENT
        value: production
