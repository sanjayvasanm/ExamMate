<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Learning Analytics & History - Otto</title>
  <link rel="stylesheet" href="../otto-theme.css"/>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    .analytics-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 640px) {
      .analytics-stats-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .stat-metric-card {
      background: var(--otto-white);
      border: var(--otto-border);
      border-radius: var(--otto-radius-md);
      padding: 18px;
      box-shadow: var(--otto-shadow-sm);
    }

    .history-item-card {
      background: var(--otto-white);
      border: var(--otto-border);
      border-radius: var(--otto-radius-md);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .history-item-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--otto-shadow-sm);
      border-color: var(--otto-iris);
    }

    /* Modal */
    .otto-detail-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 10, 0.45);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .otto-detail-modal.active {
      display: flex;
    }
    .modal-paper {
      background: var(--otto-white);
      border-radius: var(--otto-radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 30px;
      border: var(--otto-border);
      box-shadow: var(--otto-shadow-lg);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="otto-topbar">
    <div class="otto-brand-group" onclick="navigate('dashboard')">
      <button class="otto-btn-circle" style="border:none;" aria-label="Go back">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <span style="font-weight:800; font-size:1.15rem; letter-spacing:-0.02em;">Analytics & History</span>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button class="otto-btn-circle" onclick="clearSearch()" title="Refresh" aria-label="Refresh">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
  </header>

  <main class="otto-container">

    <!-- Screen 1 & Analytics Metric Row -->
    <section class="analytics-stats-grid">
      <div class="stat-metric-card">
        <p class="otto-label-caps" style="font-size:0.65rem;">TOTAL CARDS & Qs</p>
        <div style="font-size:1.8rem; font-weight:900; color:var(--otto-onyx); margin-top:4px;" id="statTotalQ">307</div>
      </div>
      <div class="stat-metric-card">
        <p class="otto-label-caps" style="font-size:0.65rem;">ACTIVE STREAK</p>
        <div style="font-size:1.8rem; font-weight:900; color:#EC9205; margin-top:4px;" id="statStreak">9 days</div>
      </div>
      <div class="stat-metric-card">
        <p class="otto-label-caps" style="font-size:0.65rem;">DOCUMENTS</p>
        <div style="font-size:1.8rem; font-weight:900; color:var(--otto-blue); margin-top:4px;" id="statTotalDocs">12</div>
      </div>
      <div class="stat-metric-card">
        <p class="otto-label-caps" style="font-size:0.65rem;">QUIZ ACCURACY</p>
        <div style="font-size:1.8rem; font-weight:900; color:#059669; margin-top:4px;">90%</div>
      </div>
    </section>

    <!-- Search / Filter -->
    <div style="margin-bottom:20px;">
      <input type="text" id="searchInput" class="search-input-field" placeholder="Search questions, calculus, physics, diagrams..." oninput="debounceSearch()"/>
    </div>

    <!-- History List -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <p class="otto-label-caps">STUDY ARCHIVE</p>
        <span class="otto-pill dark" id="archiveCountBadge" style="font-size:0.75rem;">Loading...</span>
      </div>
      <div id="historyList">
        <div style="text-align:center; padding:40px; color:#9CA3AF;">Loading your learning history...</div>
      </div>
    </section>

  </main>

  <!-- Detail Modal -->
  <div class="otto-detail-modal" id="detailModal">
    <div class="modal-paper">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <span class="otto-pill blue" id="modalSubject">Subject</span>
        <button class="otto-btn-circle" style="width:32px; height:32px;" onclick="closeDetailModal()">
          <span class="material-symbols-outlined" style="font-size:1rem;">close</span>
        </button>
      </div>

      <h3 style="font-size:1.35rem; font-weight:900; color:var(--otto-onyx); margin-bottom:16px;" id="modalQuestion">Question Title</h3>
      
      <div style="background:#F8F9FE; padding:18px; border-radius:18px; line-height:1.6; font-size:0.95rem; color:#374151; margin-bottom:20px;" id="modalAnswer">
        Answer content...
      </div>

      <div style="display:flex; gap:10px;">
        <button class="otto-btn-amber" style="flex:1;" onclick="openInWorkspace()">
          Study in Workspace
        </button>
        <button class="otto-btn-circle" style="width:46px; height:46px;" onclick="deleteCurrentQuestion()" title="Delete" aria-label="Delete question">
          <span class="material-symbols-outlined" style="color:#EF4444;">delete</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="otto-bottom-nav">
    <div class="otto-nav-item" onclick="navigate('dashboard')">
      <span class="material-symbols-outlined">grid_view</span>
      <span>Library</span>
    </div>
    <div class="otto-nav-item" onclick="navigate('upload')">
      <span class="material-symbols-outlined">add_circle</span>
      <span>Create</span>
    </div>
    <div class="otto-nav-item" onclick="navigate('flashcards')">
      <span class="material-symbols-outlined">bolt</span>
      <span>Practice</span>
    </div>
    <div class="otto-nav-item" onclick="navigate('planner')">
      <span class="material-symbols-outlined">event_note</span>
      <span>Planner</span>
    </div>
    <div class="otto-nav-item" onclick="navigate('profile')">
      <span class="material-symbols-outlined">account_circle</span>
      <span>You</span>
    </div>
  </nav>

  <div id="toast" class="otto-toast"></div>

  <script src="../api-utils.js"></script>
  <script>
    const token = getAuthToken();

    let historyItems = [];
    let activeItem = null;
    let debounceTimer = null;

    function debounceSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(loadHistory, 350);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      loadHistory();
    }

    async function loadHistory() {
      const q = document.getElementById('searchInput').value.trim();
      const url = API + '/history' + (q ? '?q=' + encodeURIComponent(q) : '');

      try {
        const res = await apiFetch(url);
        if (res && res.ok) {
          const data = await res.json();
          historyItems = data.history || [];
          document.getElementById('statTotalQ').textContent = historyItems.length || 307;
          document.getElementById('archiveCountBadge').textContent = historyItems.length + ' questions';
          renderHistoryList();
          return;
        }
      } catch (e) {
        console.warn('History fallback:', e);
      }
      renderFallbackHistory();
    }

    function renderHistoryList() {
      const container = document.getElementById('historyList');
      if (historyItems.length === 0) {
        renderFallbackHistory();
        return;
      }

      container.innerHTML = historyItems.map(item => `
        <article class="history-item-card" onclick="openItemDetail('${item.id}')">
          <div style="display:flex; align-items:center; gap:12px; min-width:0;">
            <div style="width:40px; height:40px; border-radius:12px; background:#EFF0FA; color:var(--otto-iris); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <span class="material-symbols-outlined">quiz</span>
            </div>
            <div style="min-width:0;">
              <h4 style="font-weight:800; font-size:0.95rem; color:var(--otto-onyx); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${escapeHtml(item.question)}</h4>
              <p style="font-size:0.75rem; color:#6B7280; font-weight:700;">${item.subject || 'General'} · ${item.time_label || 'Recent'}</p>
            </div>
          </div>
          <span class="material-symbols-outlined" style="color:var(--otto-iris); font-size:1.1rem;">chevron_right</span>
        </article>
      `).join('');
    }

    function renderFallbackHistory() {
      document.getElementById('archiveCountBadge').textContent = 'Sample Archive';
      const container = document.getElementById('historyList');
      container.innerHTML = `
        <article class="history-item-card" onclick="openFallback('What is the derivative of sin(x)?', 'Calculus', 'The derivative is cos(x). Proven via trigonometric limits.')">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:40px; height:40px; border-radius:12px; background:#FCE8E2; color:#EA580C; display:flex; align-items:center; justify-content:center;">
              <span class="material-symbols-outlined">functions</span>
            </div>
            <div>
              <h4 style="font-weight:800; font-size:0.95rem; color:var(--otto-onyx);">What is the derivative of sin(x)?</h4>
              <p style="font-size:0.75rem; color:#6B7280;">Calculus · Today</p>
            </div>
          </div>
          <span class="material-symbols-outlined" style="color:var(--otto-iris);">chevron_right</span>
        </article>

        <article class="history-item-card" onclick="openFallback('Explain ACID properties in database management systems.', 'Database Systems', 'Atomicity, Consistency, Isolation, Durability.')">
          <div style="display:flex; align-items:center; gap:12px;">
            <div style="width:40px; height:40px; border-radius:12px; background:#E2E6FF; color:var(--otto-blue); display:flex; align-items:center; justify-content:center;">
              <span class="material-symbols-outlined">database</span>
            </div>
            <div>
              <h4 style="font-weight:800; font-size:0.95rem; color:var(--otto-onyx);">Explain ACID properties in database management</h4>
              <p style="font-size:0.75rem; color:#6B7280;">Database Systems · Yesterday</p>
            </div>
          </div>
          <span class="material-symbols-outlined" style="color:var(--otto-iris);">chevron_right</span>
        </article>
      `;
    }

    async function openItemDetail(id) {
      try {
        const res = await apiFetch(API + '/history/' + id);
        if (res && res.ok) {
          const data = await res.json();
          activeItem = data;
          document.getElementById('modalSubject').textContent = data.subject || 'Notes';
          document.getElementById('modalQuestion').textContent = data.question;
          document.getElementById('modalAnswer').textContent = data.answer;
          document.getElementById('detailModal').classList.add('active');
        }
      } catch (e) {
        showToast('Could not load question details', 'error');
      }
    }

    function openFallback(q, sub, ans) {
      activeItem = { question: q, subject: sub, answer: ans };
      document.getElementById('modalSubject').textContent = sub;
      document.getElementById('modalQuestion').textContent = q;
      document.getElementById('modalAnswer').textContent = ans;
      document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function openInWorkspace() {
      if (activeItem) {
        localStorage.setItem('em_last_answer', JSON.stringify({
          question: activeItem.question,
          subject: activeItem.subject,
          answer: activeItem.answer,
          mermaid_code: activeItem.mermaid_code || ''
        }));
        navigate('workspace');
      }
    }

    async function deleteCurrentQuestion() {
      if (!confirm('Remove this question from your history?')) return;
      if (activeItem && activeItem.id) {
        apiFetch(API + '/history/' + activeItem.id, { method: 'DELETE' }).catch(() => {});
      }
      closeDetailModal();
      showToast('Question removed', 'default');
      loadHistory();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[c]));
    }

    loadHistory();
  </script>
</body>
</html>
