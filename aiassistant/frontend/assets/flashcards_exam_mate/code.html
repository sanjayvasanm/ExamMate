<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Mate - Flashcards</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="../app-shell.css">
</head>
<body class="min-h-screen bg-slate-50 pb-24">
  <header class="sticky top-0 z-10 flex items-center justify-between bg-[#0D0C22] px-5 py-4 text-white">
    <button onclick="navigate('dashboard')" class="font-bold">Exam Mate</button>
    <nav class="hidden gap-5 text-sm md:flex"><button onclick="navigate('upload')">Library</button><button onclick="navigate('quiz')">Quiz</button><button onclick="navigate('planner')">Planner</button></nav>
    <button onclick="navigate('profile')" class="text-sm font-bold text-emerald-300">Profile</button>
  </header>
  <main class="mx-auto max-w-3xl px-5 py-10">
    <div class="flex items-start justify-between gap-4">
      <div><p class="text-xs font-bold uppercase tracking-widest text-emerald-700">Spaced revision</p>
      <h1 class="mt-2 text-3xl font-black">Flashcards</h1>
      <p class="mt-2 text-slate-500">Build a calm, repeatable review habit from your study material.</p></div>
      <span class="hidden rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700 sm:inline-flex">Saved review</span>
    </div>
    <form id="generate" class="mt-7 rounded-2xl bg-white p-5 shadow-sm">
      <label class="block font-bold">Topic<input id="topic" required maxlength="160" class="mt-2 w-full rounded-xl border p-3" placeholder="e.g. Cell biology"></label>
      <button class="mt-4 rounded-xl bg-[#008A3F] px-5 py-3 font-bold text-white">Generate cards</button>
    </form>
    <section class="mt-8"><div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-bold">Your review queue</h2><span class="text-xs font-semibold text-slate-400">Tap a card to reveal</span></div><div id="cards" class="grid gap-4 sm:grid-cols-2"></div></section>
    <p id="message" class="mt-5 text-sm text-slate-500" role="status"></p>
  </main>
  <nav class="fixed bottom-0 flex w-full justify-around border-t bg-white px-3 py-3 text-xs font-bold"><button onclick="navigate('dashboard')">Home</button><button class="text-[#008A3F]" onclick="navigate('flashcards')">Cards</button><button onclick="navigate('quiz')">Quiz</button><button onclick="navigate('profile')">Profile</button></nav>
  <script src="../api-utils.js"></script>
  <script>
    if (!localStorage.getItem('em_token')) navigate('login');
    const cardsElement = document.getElementById('cards');
    const message = document.getElementById('message');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function render(cards) {
      cardsElement.innerHTML = cards.length ? cards.map((card, index) => `<article class="rounded-2xl bg-white p-5 shadow-sm"><button class="w-full text-left" onclick="this.querySelector('.back').classList.toggle('hidden')"><p class="text-xs font-bold uppercase tracking-widest text-emerald-700">Card ${index + 1}</p><h2 class="mt-3 font-bold">${escapeHtml(card.front)}</h2><p class="back mt-4 hidden border-t pt-4 text-sm leading-6 text-slate-600">${escapeHtml(card.back)}</p></button><div class="mt-4 flex gap-2 border-t pt-3">${['again','hard','good','easy'].map(rating => `<button onclick="review('${card.id}','${rating}')" class="rounded-lg bg-slate-100 px-2 py-1 text-xs font-bold hover:bg-emerald-50">${rating}</button>`).join('')}</div></article>`).join('') : '<p class="text-sm text-slate-500">No cards yet. Generate your first revision set.</p>';
    }
    async function loadCards() { const response = await apiFetch(API + '/flashcards'); if (!response || !response.ok) { message.textContent = 'Apply the flashcard migration before using this feature.'; return; } render((await response.json()).cards || []); }
    async function review(id, rating) { const response = await apiFetch(API + '/flashcards/' + id + '/review', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({rating})}); if (response && response.ok) { message.textContent = 'Review saved.'; loadCards(); } else message.textContent = 'Could not save review.'; }
    document.getElementById('generate').onsubmit = async event => { event.preventDefault(); const button = event.target.querySelector('button'); button.disabled = true; message.textContent = 'Generating cards from your study material...'; try { const response = await apiFetch(API + '/flashcards', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic:document.getElementById('topic').value, count:10})}); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Generation failed'); render(data.cards || []); message.textContent = 'Cards saved to your revision library.'; } catch (error) { message.textContent = error.message; } finally { button.disabled = false; } };
    loadCards();
  </script>
</body>
</html>
