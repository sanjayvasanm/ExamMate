<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Practice Quiz - Otto</title>
  <link rel="stylesheet" href="../otto-theme.css"/>
  <style>
    /* Question Card (Otto Screen 4) */
    .question-card {
      background: var(--otto-pastel-blue);
      border: 1px solid rgba(101, 109, 226, 0.2);
      border-radius: var(--otto-radius-lg);
      padding: 28px;
      margin-bottom: 24px;
      position: relative;
    }
    .question-mascot-bubble {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--otto-tint);
      color: var(--otto-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
    }

    /* Option Cards */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .quiz-option {
      background: var(--otto-white);
      border: var(--otto-border);
      border-radius: var(--otto-radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--otto-onyx);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .quiz-option:hover {
      transform: translateY(-2px);
      box-shadow: var(--otto-shadow-sm);
    }
    .opt-letter {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--otto-onyx);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Selected state (Otto Screen 4: Amber highlight with checkmark) */
    .quiz-option.selected {
      background: var(--otto-amber);
      border-color: var(--otto-amber);
      color: var(--otto-onyx);
      box-shadow: 0 8px 24px rgba(236, 146, 5, 0.3);
    }
    .quiz-option.selected .opt-letter {
      background: var(--otto-onyx);
      color: #FFF;
    }
    .quiz-option.correct {
      background: #E1F7EB;
      border-color: #10B981;
    }
    .quiz-option.wrong {
      background: #FEE2E2;
      border-color: #EF4444;
    }

    /* Quiz Complete Screen (Otto Screen 6) */
    .results-container {
      display: none;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.4s ease;
    }
    .score-badge-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 36px 0;
    }
    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: var(--otto-shadow-md);
    }
    .score-circle.nailed {
      background: var(--otto-pastel-blue);
      color: var(--otto-blue);
    }
    .score-circle.redo {
      background: var(--otto-blue);
      color: #FFF;
    }
  </style>
</head>
<body>

  <!-- Top Bar (Otto Screen 4: Close, 4/12 progress, skip) -->
  <header class="otto-topbar">
    <button class="otto-btn-circle" onclick="navigate('dashboard')" style="border:none;" aria-label="Close quiz">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div style="font-weight:800; font-size:1.05rem;" id="quizCounterText">
      1 / 5
    </div>

    <button class="otto-btn-circle" onclick="skipQuestion()" title="Skip question" aria-label="Skip question">
      <span class="material-symbols-outlined">keyboard_double_arrow_right</span>
    </button>
  </header>

  <main class="otto-container">

    <!-- Active Quiz Mode (Otto Screen 4) -->
    <div id="activeQuizView">
      <p class="otto-label-caps" style="color:#6B7280; margin-bottom:12px;" id="quizSubjectTag">INTRO TO CALCULUS · QUIZ</p>

      <!-- Question Card with Mascot Bubble -->
      <div class="question-card">
        <span class="otto-pill dark" style="font-size:0.7rem; margin-bottom:14px;">question</span>
        <h2 id="qText" style="font-size:1.6rem; font-weight:900; line-height:1.3; color:var(--otto-onyx); max-width:85%;">
          What is the derivative of sin(x)?
        </h2>
        <div class="question-mascot-bubble">?</div>
      </div>

      <!-- Multiple Choice Options -->
      <div class="options-list" id="optionsContainer">
        <!-- Rendered dynamically -->
      </div>

      <!-- Explanation Box -->
      <div id="explanationBox" style="display:none; background:var(--otto-white); border:var(--otto-border); border-radius:var(--otto-radius-md); padding:18px; margin-bottom:20px;">
        <span class="otto-pill mint" style="margin-bottom:8px;">Explanation</span>
        <p id="expText" style="font-size:0.9rem; color:#4B5563; line-height:1.5; margin-top:8px;"></p>
      </div>

      <!-- Next Button -->
      <button class="otto-btn-amber" style="width:100%; padding:16px; font-size:1rem;" id="nextBtn" onclick="nextQuestion()">
        <span>Next question</span> <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>

    <!-- Quiz Complete View (Otto Screen 6) -->
    <div class="results-container" id="resultsView">
      <p class="otto-label-caps" style="color:#6B7280; font-size:0.85rem; margin-bottom:12px;">QUIZ COMPLETE</p>
      <div class="otto-stat-huge" id="finalScorePercent" style="font-size:5.5rem; margin-bottom:8px;">90%</div>
      <p style="font-size:1.2rem; font-weight:800; color:var(--otto-onyx);" id="scoreSummaryText">4 of 5 correct</p>

      <!-- Circular Score Badges (Otto Screen 6) -->
      <div class="score-badge-row">
        <div class="score-circle nailed">
          <span style="font-size:2.2rem; font-weight:900;" id="nailedCount">4</span>
          <span style="font-size:0.7rem; font-weight:800; opacity:0.8;">nailed it</span>
        </div>
        <div class="score-circle redo">
          <span style="font-size:2.2rem; font-weight:900;" id="redoCount">1</span>
          <span style="font-size:0.7rem; font-weight:800; opacity:0.8;">to redo</span>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex; flex-direction:column; gap:12px; max-width:320px; margin:0 auto;">
        <button class="otto-btn-amber" style="width:100%; padding:16px;" onclick="reviewMistakes()">
          Review these
        </button>
        <button class="otto-btn-outline" style="width:100%; padding:14px;" onclick="restartQuiz()">
          Try again
        </button>
        <button class="otto-btn-dark" style="width:100%; padding:14px;" onclick="navigate('dashboard')">
          Back to Library
        </button>
      </div>
    </div>

  </main>

  <div id="toast" class="otto-toast"></div>

  <script src="../api-utils.js"></script>
  <script>
    const token = getAuthToken();

    const questions = [
      {
        question: "What is the derivative of sin(x)?",
        options: ["cos(x)", "-cos(x)", "tan(x)", "-sin(x)"],
        correct_index: 0,
        explanation: "By fundamental calculus rules, d/dx[sin(x)] = cos(x)."
      },
      {
        question: "What is the integral of 1/x dx?",
        options: ["ln|x| + C", "e^x + C", "x^2 / 2 + C", "-1/x^2 + C"],
        correct_index: 0,
        explanation: "The antiderivative of 1/x is the natural logarithm ln|x| + C."
      },
      {
        question: "Which data structure follows First-In, First-Out (FIFO)?",
        options: ["Stack", "Queue", "Binary Tree", "Heap"],
        correct_index: 1,
        explanation: "A queue processes incoming elements in first-in, first-out order."
      },
      {
        question: "What does RLS stand for in database architecture?",
        options: ["Relational Logic Schema", "Row Level Security", "Recursive Log System", "Read Lock State"],
        correct_index: 1,
        explanation: "Row Level Security restricts row access based on security policies."
      },
      {
        question: "Which HTTP status code indicates 'Unauthorized'?",
        options: ["400", "401", "403", "404"],
        correct_index: 1,
        explanation: "401 specifically denotes unauthenticated or missing valid credentials."
      }
    ];

    let currentIdx = 0;
    let selectedOption = null;
    let correctCount = 0;
    let wrongCount = 0;

    function renderQuestion() {
      const q = questions[currentIdx];
      document.getElementById('quizCounterText').textContent = `${currentIdx + 1} / ${questions.length}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('explanationBox').style.display = 'none';
      selectedOption = null;

      const letters = ['A', 'B', 'C', 'D'];
      const cont = document.getElementById('optionsContainer');
      cont.innerHTML = q.options.map((opt, i) => `
        <div class="quiz-option" id="opt_${i}" onclick="selectAnswer(${i})">
          <div class="opt-letter">${letters[i]}</div>
          <span style="flex:1;">${opt}</span>
          <span class="material-symbols-outlined checkmark" style="display:none; font-size:1.3rem;">check</span>
        </div>
      `).join('');
    }

    function selectAnswer(index) {
      if (selectedOption !== null) return; // Prevent multiple answers
      selectedOption = index;
      const q = questions[currentIdx];

      const optionEl = document.getElementById('opt_' + index);
      optionEl.classList.add('selected');
      const check = optionEl.querySelector('.checkmark');
      if (check) check.style.display = 'inline-block';

      if (index === q.correct_index) {
        correctCount++;
        showToast('Correct! +10 Points', 'success');
      } else {
        wrongCount++;
        showToast('Incorrect', 'error');
        document.getElementById('opt_' + q.correct_index).classList.add('correct');
      }

      document.getElementById('expText').textContent = q.explanation;
      document.getElementById('explanationBox').style.display = 'block';
    }

    function skipQuestion() {
      nextQuestion();
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('activeQuizView').style.display = 'none';
      document.getElementById('resultsView').style.display = 'block';

      const pct = Math.round((correctCount / questions.length) * 100);
      document.getElementById('finalScorePercent').textContent = pct + '%';
      document.getElementById('scoreSummaryText').textContent = `${correctCount} of ${questions.length} correct`;
      document.getElementById('nailedCount').textContent = correctCount;
      document.getElementById('redoCount').textContent = wrongCount;

      // Save quiz to backend
      apiFetch(API + '/quizzes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: 'Calculus and Engineering Practice Quiz',
          score: correctCount,
          total_questions: questions.length
        })
      }).catch(() => {});
    }

    function restartQuiz() {
      currentIdx = 0;
      correctCount = 0;
      wrongCount = 0;
      document.getElementById('activeQuizView').style.display = 'block';
      document.getElementById('resultsView').style.display = 'none';
      renderQuestion();
    }

    function reviewMistakes() {
      showToast('Opening revision flashcards for missed concepts...', 'default');
      setTimeout(() => navigate('flashcards'), 600);
    }

    renderQuestion();
  </script>
</body>
</html>
